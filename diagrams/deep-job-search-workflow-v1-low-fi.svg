<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc">
  <title id="title">JoBatea tentative v1 Deep Job Search workflow low-fidelity reference</title>
  <desc id="desc">Five desktop states cover missing resume, broad search confirmation, profile guidance, returned results, and search history.</desc>
  <style>
    .bg{fill:#edf1ef}.frame{fill:#fbfcfb;stroke:#93a39b;stroke-width:2}.side{fill:#173c35}.active{fill:#28594d}.card{fill:#fff;stroke:#b9c4be;stroke-width:1.4}.soft{fill:#e7ece9;stroke:#b9c4be;stroke-width:1.2}.warn{fill:#fff3d8;stroke:#ad7a24;stroke-width:1.4}.ok{fill:#e4f0e8;stroke:#2e7158;stroke-width:1.4}.primary{fill:#1f6b58}.ring{fill:none;stroke:#d7dfda;stroke-width:9}.value{fill:none;stroke:#1f6b58;stroke-width:9;stroke-linecap:round}.head{font:700 15px Arial,sans-serif;fill:#14231f}.title{font:700 23px Arial,sans-serif;fill:#14231f}.body{font:400 12px Arial,sans-serif;fill:#30443c}.small{font:400 10px Arial,sans-serif;fill:#596a62}.label{font:700 9px Arial,sans-serif;letter-spacing:1px;fill:#596a62}.nav{font:400 11px Arial,sans-serif;fill:#dbe7e1}.navb,.btn{font:700 11px Arial,sans-serif;fill:#fff}.line{fill:none;stroke:#6b7c74;stroke-width:1.5;stroke-dasharray:4 3}.note{font:400 10px Arial,sans-serif;fill:#40524b}
  </style>
  <rect class="bg" width="1600" height="1420"/>
  <text x="50" y="48" class="title">JoBatea / Tentative v1 Deep Job Search workflow</text>
  <text x="50" y="71" class="body">Desktop low-fi handoff. One path: prepare profile, search, review a run, revisit history.</text>

  <!-- flow rail -->
  <rect x="50" y="93" width="1500" height="62" rx="6" class="card"/>
  <text x="74" y="119" class="label">WORKFLOW</text>
  <text x="74" y="140" class="body">1. Add resume</text><text x="300" y="140" class="body">2. Refine or run broad</text><text x="585" y="140" class="body">3. Start research</text><text x="845" y="140" class="body">4. Review returned jobs</text><text x="1190" y="140" class="body">5. Revisit search history</text>
  <path d="M220 135H280M505 135H565M760 135H825M1125 135H1175" class="line"/>

  <!-- A missing resume -->
  <text x="50" y="197" class="head">A. Account created: resume is required</text>
  <rect x="50" y="215" width="470" height="365" rx="4" class="frame"/><rect x="50" y="215" width="125" height="365" class="side"/>
  <text x="67" y="246" class="navb">JoBatea</text><rect x="60" y="267" width="105" height="29" rx="4" class="active"/><text x="70" y="286" class="navb">Deep Search</text><text x="70" y="325" class="nav">Profile</text><text x="70" y="356" class="nav">History</text>
  <text x="195" y="247" class="head">Deep Job Search</text><text x="195" y="267" class="small">One essential step before searching.</text>
  <rect x="195" y="287" width="295" height="108" rx="6" class="warn"/><text x="213" y="315" class="head">Add your resume</text><text x="213" y="337" class="body">JoBatea uses it to compare your experience</text><text x="213" y="354" class="body">with returned jobs.</text><rect x="213" y="365" width="100" height="25" rx="4" class="primary"/><text x="230" y="382" class="btn">Add resume</text>
  <rect x="195" y="415" width="295" height="91" rx="6" class="soft"/><text x="213" y="439" class="label">SEARCH STATUS</text><text x="213" y="461" class="body">Resume: needed to start</text><text x="213" y="483" class="small">Search is unavailable until usable text exists.</text>

  <!-- B broad search -->
  <text x="565" y="197" class="head">B. Resume ready: wizard is recommended, not required</text>
  <rect x="565" y="215" width="470" height="365" rx="4" class="frame"/><rect x="565" y="215" width="125" height="365" class="side"/>
  <text x="582" y="246" class="navb">JoBatea</text><rect x="575" y="267" width="105" height="29" rx="4" class="active"/><text x="585" y="286" class="navb">Deep Search</text><text x="585" y="325" class="nav">Profile</text><text x="585" y="356" class="nav">History</text>
  <text x="710" y="247" class="head">Deep Job Search</text>
  <circle cx="736" cy="291" r="18" class="ring"/><circle cx="736" cy="291" r="18" class="value" stroke-dasharray="45 113" transform="rotate(-90 736 291)"/><text x="727" y="295" class="small">40%</text><text x="770" y="287" class="head">Search profile</text><text x="770" y="304" class="small">Hover/focus for details</text>
  <rect x="710" y="326" width="295" height="110" rx="6" class="warn"/><text x="728" y="352" class="head">Broader search ahead</text><text x="728" y="373" class="small">Add roles and preferences for tighter results.</text><rect x="728" y="394" width="118" height="25" rx="4" class="primary"/><text x="739" y="411" class="btn">Complete profile</text><rect x="856" y="394" width="124" height="25" rx="4" class="card"/><text x="868" y="411" class="small">Run broad search</text>
  <rect x="710" y="455" width="295" height="54" rx="6" class="soft"/><text x="728" y="477" class="label">CURRENT CONTEXT</text><text x="728" y="495" class="small">Resume ready · Roles/location not specified</text>

  <!-- C profile and guidance -->
  <text x="1080" y="197" class="head">C. Profile and Criteria: generated guidance</text>
  <rect x="1080" y="215" width="470" height="365" rx="4" class="frame"/><rect x="1080" y="215" width="125" height="365" class="side"/>
  <text x="1097" y="246" class="navb">JoBatea</text><text x="1098" y="286" class="nav">Deep Search</text><rect x="1090" y="306" width="105" height="29" rx="4" class="active"/><text x="1101" y="325" class="navb">Profile</text><text x="1098" y="366" class="nav">History</text>
  <text x="1225" y="247" class="head">Profile and Criteria</text><text x="1225" y="267" class="small">The agent reads this saved guidance.</text>
  <rect x="1225" y="286" width="295" height="184" rx="6" class="card"/><text x="1242" y="311" class="head">Prompt Guidance Sheet</text><text x="1242" y="332" class="label">TARGET ROLES</text><text x="1242" y="349" class="small">Data Engineer, Analytics Engineer</text><text x="1242" y="372" class="label">REQUIREMENTS</text><text x="1242" y="389" class="small">Remote/hybrid · seniority flexible</text><text x="1242" y="412" class="label">ADDITIONAL CONTEXT</text><text x="1242" y="429" class="small">Collaborative, product-minded team.</text><rect x="1242" y="440" width="110" height="22" rx="4" class="soft"/><text x="1253" y="455" class="small">Edit profile</text>
  <rect x="1225" y="489" width="295" height="43" rx="6" class="ok"/><text x="1242" y="515" class="body">Saved guidance is ready for the next run.</text>

  <!-- D returned results -->
  <text x="50" y="632" class="head">D. Completed run: returned results</text>
  <rect x="50" y="650" width="985" height="430" rx="4" class="frame"/><rect x="50" y="650" width="165" height="430" class="side"/>
  <text x="72" y="681" class="navb">JoBatea</text><rect x="63" y="703" width="139" height="30" rx="4" class="active"/><text x="78" y="723" class="navb">Deep Job Search</text><text x="78" y="761" class="nav">Profile &amp; Criteria</text><text x="78" y="794" class="nav">Search History</text>
  <text x="245" y="682" class="head">Data engineering roles</text><text x="245" y="702" class="small">Run completed today, 10:42 AM · Guidance snapshot saved · 7 returned</text>
  <rect x="245" y="723" width="760" height="43" rx="5" class="ok"/><text x="263" y="749" class="body">Research complete. Results passed your saved requirements.</text>
  <rect x="245" y="786" width="760" height="39" rx="4" class="soft"/><text x="263" y="810" class="label">COMPANY</text><text x="440" y="810" class="label">JOB TITLE</text><text x="650" y="810" class="label">POSTED</text><text x="800" y="810" class="label">MATCH</text>
  <rect x="245" y="826" width="760" height="58" rx="4" class="card"/><text x="263" y="850" class="body">Northstar Health</text><text x="440" y="850" class="body">Senior Data Engineer</text><text x="650" y="850" class="small">Aug 29 · verified</text><text x="800" y="850" class="body">91% · SQL, pipelines</text><text x="922" y="869" class="small">Open posting</text>
  <rect x="245" y="885" width="760" height="58" rx="4" class="card"/><text x="263" y="909" class="body">Arc Systems</text><text x="440" y="909" class="body">Analytics Engineer</text><text x="650" y="909" class="small">Aug 30 · source date</text><text x="800" y="909" class="body">84% · dbt, remote</text><text x="922" y="928" class="small">Open posting</text>
  <rect x="245" y="962" width="760" height="78" rx="6" class="soft"/><text x="263" y="988" class="head">Recent searches</text><text x="263" y="1010" class="small">Today: 7 returned · Aug 29: 5 returned · Aug 27: 0 returned</text><text x="884" y="1010" class="small">View all history</text>

  <!-- E history -->
  <text x="1080" y="632" class="head">E. Search History: every immutable run</text>
  <rect x="1080" y="650" width="470" height="430" rx="4" class="frame"/><rect x="1080" y="650" width="125" height="430" class="side"/>
  <text x="1097" y="681" class="navb">JoBatea</text><text x="1098" y="721" class="nav">Deep Search</text><text x="1098" y="753" class="nav">Profile</text><rect x="1090" y="769" width="105" height="30" rx="4" class="active"/><text x="1101" y="789" class="navb">History</text>
  <text x="1225" y="682" class="head">Search History</text><rect x="1225" y="702" width="295" height="34" rx="4" class="soft"/><text x="1240" y="723" class="small">Filter by date or criteria</text>
  <text x="1225" y="766" class="label">AUGUST 31</text><rect x="1225" y="780" width="295" height="65" rx="5" class="card"/><text x="1242" y="805" class="body">Data engineering roles</text><text x="1242" y="824" class="small">10:42 AM · 7 returned · Complete</text><text x="1434" y="824" class="small">Results</text>
  <text x="1225" y="872" class="label">AUGUST 29</text><rect x="1225" y="886" width="295" height="65" rx="5" class="card"/><text x="1242" y="911" class="body">Analytics roles</text><text x="1242" y="930" class="small">4:18 PM · 5 returned · Complete</text><text x="1434" y="930" class="small">Results</text>
  <text x="1225" y="978" class="label">AUGUST 27</text><rect x="1225" y="992" width="295" height="65" rx="5" class="warn"/><text x="1242" y="1017" class="body">Broad search</text><text x="1242" y="1036" class="small">9:05 AM · 0 returned · Complete</text><text x="1434" y="1036" class="small">Run</text>

  <path d="M500 379H542V440" class="line"/><text x="388" y="451" class="note">Required resume is distinct from advisory profile completion.</text>
  <path d="M1007 742H1058" class="line"/><text x="870" y="734" class="note">Each run opens its own stored result set.</text>
  <text x="50" y="1127" class="head">Handoff Notes</text>
  <text x="50" y="1151" class="body">Primary pages: Deep Job Search, Profile and Criteria, Search History. Search runs are immutable snapshots; duplicate employer postings reappear only with verified fresh posting evidence.</text>
  <text x="50" y="1173" class="body">Out of scope for this v1 visual: live agent progress stages, expanded job detail/hiring intelligence, mobile layouts, final typography and tokens, quota/payment flow, and job pipeline statuses.</text>
  <text x="50" y="1390" class="small">Companion requirements: onboarding-search-history-v1-spec.md and ui-requirements.md. This is a tentative low-fidelity design, not an implementation artifact.</text>
</svg>